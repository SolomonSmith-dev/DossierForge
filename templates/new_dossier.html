{% extends "base.html" %}
{% block title %}New Dossier - DossierForge{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <h1 class="h3 mb-3">New Dossier</h1>
        <form method="post">
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class="mb-3">
                <label for="alias" class="form-label">Alias</label>
                <input type="text" class="form-control" id="alias" name="alias">
            </div>
            <div class="mb-3">
                <label for="organization" class="form-label">Organization</label>
                <input type="text" class="form-control" id="organization" name="organization">
            </div>
            <div class="mb-3">
                <label for="authorization_scope" class="form-label">Authorization scope / reference</label>
                <textarea class="form-control" id="authorization_scope" name="authorization_scope"
                          rows="2" placeholder="e.g. engagement #1234, signed SOW, my own infrastructure"></textarea>
                <div class="form-text">Record what authorizes this investigation (engagement, ticket, ownership).</div>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="authorized" name="authorized" value="yes" required>
                <label class="form-check-label" for="authorized">
                    I confirm I am authorized to investigate this target and will use DossierForge
                    only for lawful, authorized reconnaissance.
                </label>
            </div>
            <button type="submit" class="btn btn-success">Create</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
